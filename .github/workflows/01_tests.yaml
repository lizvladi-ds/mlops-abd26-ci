name: "01 Tests"
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - name: Cache downloaded pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.11-${{ hashFiles('environment.yml', 'requirements*.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Save test report even if pytest failed
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
