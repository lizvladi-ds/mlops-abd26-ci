name: "03 Python matrix"
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python }}
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - name: Cache downloaded pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('environment.yml', 'requirements*.txt') }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/pytest.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python }}
          path: reports/pytest.xml
          retention-days: 7
