name: "06 PostgreSQL integration"
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - run: python -m pip install -r requirements-postgres.txt
      - name: Save and read a prediction in a real database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:${{ job.services.postgres.ports[5432] }}/test_db
        run: python -m pytest -q examples/postgres/test_prediction_log.py
