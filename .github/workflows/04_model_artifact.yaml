name: "04 Model between jobs"
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      model-name: ${{ steps.metadata.outputs.model_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - run: python -m pip install -r requirements.txt
      - run: python -m wine_project.train --output-dir artifacts
      - name: Give the artifact a name
        id: metadata
        run: echo "model_name=wine-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.model_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  check:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.train.outputs.model-name }}
          path: artifacts/
      - name: Check loaded model without fit
        run: python check_artifact.py --directory artifacts
