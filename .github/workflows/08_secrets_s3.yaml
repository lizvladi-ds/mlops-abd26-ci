name: "08 Read private CSV from S3"
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
jobs:
  read-private-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - run: python -m pip install -r requirements-s3.txt
      - name: Read private CSV without printing credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'ru-central1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_KEY: ${{ vars.S3_KEY }}
        run: python read_private_csv.py
