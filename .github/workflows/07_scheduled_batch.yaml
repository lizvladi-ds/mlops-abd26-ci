name: "07 Scheduled batch"
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: batch-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -el {0}
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: mlops26
          environment-file: environment.yml
      - run: python -m pip install -r requirements.txt
      - name: Prepare a demo model
        run: python -m wine_project.train --output-dir artifacts
      - name: Predict rows from a CSV file
        run: >-
          python -m wine_project.predict
          --model artifacts/model.pkl
          --input data/new_wine.csv
          --output reports/predictions.csv
      - name: Save this run's batch result
        uses: actions/upload-artifact@v4
        with:
          name: batch-predictions-${{ github.run_id }}
          path: reports/predictions.csv
          if-no-files-found: error
          retention-days: 7
